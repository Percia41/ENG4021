<div class="form-field">
    {% if field.field.widget.input_type == 'checkbox' %}
    <label class="form-check" for="{{ field.id_for_label }}">{{ field }} <span>{{ field.label }}</span></label>
    {% else %}
    <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% endif %}
    {% if field.help_text %}<div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}<p class="form-errors" role="alert">{{ error }}</p>{% endfor %}
</div>

{% extends 'core/login/base.html' %}
{% load static %}

{% block title %}Senha alterada | FioFora{% endblock %}

{% block login_styles %}
<link rel="stylesheet" href="{% static 'core/login/password_reset.css' %}">
{% endblock %}

{% block content %}
<div class="form-card form-card--compact">
    <span class="feature-icon" aria-hidden="true"><i class="bi bi-check-circle"></i></span>
    <p class="eyebrow">Tudo certo</p>
    <h1>Senha alterada</h1>
    <p class="form-intro">Sua nova senha já está valendo. Entre com seu e-mail e a nova senha.</p>
    <a class="button button--full" href="{% url 'login_page' %}">Entrar</a>
</div>
{% endblock %}
